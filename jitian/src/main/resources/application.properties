spring.application.name=jitian

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jitian
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# MyBatis-Plus Configuration
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.blue.jitian.Entity

# Spring Security (Temporary disable for development)
spring.security.user.name=admin
spring.security.user.password=change_me

# Server Configuration
server.port=8080
