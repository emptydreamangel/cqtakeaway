# 测试环境配置
spring.application.name=jitian-test

# 测试数据库配置 (使用内存数据库H2进行单元测试，或使用单独的测试数据库)
spring.datasource.url=jdbc:postgresql://localhost:5432/jitian_test
spring.datasource.username=postgres
spring.datasource.password=zhangyuan7959
spring.datasource.driver-class-name=org.postgresql.Driver

